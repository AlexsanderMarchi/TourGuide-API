spring.application.name=TourGuideApiApplication

## Para testes de login local sem MySql. Com o banco, o usuario e senha sera cuidado pelo UsuarioService
#spring.security.user.name=admin
#spring.security.user.password=123456

## caso queira rodar o banco local para testes, pode rodar pelo docker:
#docker run -d --name tourguide-mysql \
#  -e MYSQL_ROOT_PASSWORD=root \
#  -e MYSQL_DATABASE=tour_guide_db \
#  -p 3306:3306 \
#  -v tourguide-mysql-data:/var/lib/mysql \
#  mysql:8

## modificacao do JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

## configuracao do MySql
spring.datasource.url=jdbc:mysql://127.0.0.1/tour_guide_db
spring.datasource.username=root
spring.datasource.password=root

## variavel de ambiente, senao achar, ele pega o "12345678"
api.security.token.secret=${JWT_SECRET:12345678}

## configuracao de email (esqueci minha senha). Para Gmail, use uma "senha de app", nao a senha da conta
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
api.mail.remetente=${MAIL_USERNAME:nao-responda@tourguide.com.br}

## url do front, usada para montar o link enviado no email
api.frontend.url=${FRONTEND_URL:http://localhost:5173}
