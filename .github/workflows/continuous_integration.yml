name: CI

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Sobe um MySQL para o @SpringBootTest (contextLoads) conseguir conectar e o Flyway rodar as migrations.
    # Usuário, senha e banco batem com o application.properties (root/root em 127.0.0.1/tour_guide_db)
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tour_guide_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # Baixa o código do repositório para o runner
      - name: Checkout
        uses: actions/checkout@v4

      # Instala o Java na mesma versão usada no Dockerfile e no pom.xml, com cache das dependências do Maven
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Compila, roda os testes e gera o .jar para validar o PR
      - name: Build e testes
        run: ./mvnw -B verify
